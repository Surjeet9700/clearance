[build]
  command = "npm run build"
  publish = ".output/public"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**", ".output/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
